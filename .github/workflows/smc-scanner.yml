name: SMC Scanner

"on":
  # Ручной запуск для проверки после настройки.
  workflow_dispatch:

  # Минское время: с 08:05 до 20:55 каждые 10 минут,
  # плюс заключительный запуск в 21:00.
  schedule:
    - cron: '5-55/10 8-20 * * *'
      timezone: 'Europe/Minsk'
    - cron: '0 21 * * *'
      timezone: 'Europe/Minsk'

permissions:
  contents: read

# Не допускаем параллельную запись одной и той же SQLite-базы.
concurrency:
  group: smc-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Scan TOP-40 crypto market
    runs-on: ubuntu-latest
    timeout-minutes: 9

    env:
      PYTHONUNBUFFERED: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TVKIT_AUTH_TOKEN: ${{ secrets.TVKIT_AUTH_TOKEN }}
      TOP_N_SYMBOLS: '40'
      UNIVERSE_REFRESH_SECONDS: '21600'
      MAX_TV_CONCURRENT_REQUESTS: '3'
      BARS_COUNT: '500'
      ACCOUNT_EQUITY_USDT: '0'
      RISK_PER_TRADE_PCT: '1.0'
      LOG_LEVEL: 'INFO'
      SIGNAL_DB_PATH: 'smc_signals.sqlite3'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Runner каждый раз новый, поэтому восстанавливаем SQLite из cache.
      # В БД только ключи отправленных сигналов и время, секретов там нет.
      - name: Restore signal database
        uses: actions/cache/restore@v6
        with:
          path: smc_signals.sqlite3
          key: smc-signal-db-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            smc-signal-db-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Telegram secrets
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID") if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          print("Telegram secrets are configured.")
          PY

      - name: Run one scan
        run: python smc_scanner.py --once

      # SQLite сохраняет защиту от повторных уведомлений между запусками.
      - name: Save signal database
        if: ${{ always() && hashFiles('smc_signals.sqlite3') != '' }}
        uses: actions/cache/save@v6
        with:
          path: smc_signals.sqlite3
          key: smc-signal-db-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
